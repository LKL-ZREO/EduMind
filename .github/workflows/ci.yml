name: CI — Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  # ==================== 后端测试 ====================
  backend-test:
    name: Backend — Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: "maven"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('edumind/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build & Test
        run: |
          cd edumind
          chmod +x mvnw
          ./mvnw verify -Dspring.profiles.active=test \
            -Ddependency-check.skip=true \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/postgres \
            -Dspring.datasource.username=postgres \
            -Dspring.datasource.password=postgres \
            -Dspring.flyway.enabled=false \
            -Dedumind.live.token-secret=ci-test-secret-key-must-be-at-least-256-bits-for-jjwt!! \
            --batch-mode
        env:
          MCP_API_KEY: ci-test-key

      - name: Session security integration tests
        run: |
          cd edumind
          ./mvnw test -Dgroups=integration -Dsurefire.excluded-groups=none \
            -Dspring.profiles.active=test \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/postgres \
            -Dspring.datasource.username=postgres \
            -Dspring.datasource.password=postgres \
            -Dspring.flyway.enabled=true \
            -Dedumind.live.token-secret=ci-test-secret-key-must-be-at-least-256-bits-for-jjwt!! \
            --batch-mode
        env:
          MCP_API_KEY: ci-test-key

      - name: Report integration test failures
        if: failure()
        shell: bash
        run: |
          cd edumind
          grep -h -E '<<< (FAILURE|ERROR)|^Caused by:|AssertionError|expected:|but was:' \
            target/surefire-reports/*.txt 2>/dev/null | head -n 20 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=Integration test failure::$line"
            done

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: edumind/target/site/jacoco/
          retention-days: 7

  # ==================== 前端测试 ====================
  frontend-test:
    name: Frontend React — Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: react-project/package-lock.json

      - name: Install dependencies
        run: cd react-project && npm ci

      - name: Run quality gate
        run: cd react-project && npm run ci:check

  # ==================== Docker Build (sanity check) ====================
  docker-build:
    name: Docker — Build image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build JAR
        run: |
          cd edumind
          chmod +x mvnw
          ./mvnw package -DskipTests --batch-mode

      - name: Build Docker image
        run: cd edumind && docker build -t edumind:ci-test .

      - name: Build React Nginx image
        run: docker build -f edumind/Dockerfile.nginx -t edumind-nginx:ci-test .

      - name: Verify backend image
        run: docker images edumind:ci-test

      - name: Verify React Nginx image
        run: |
          docker run -d --name edumind-nginx-ci \
            --add-host app:127.0.0.1 \
            -e DOMAIN=localhost \
            -p 127.0.0.1:8088:80 \
            edumind-nginx:ci-test
          curl --retry 10 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8088/health
          curl -fsS http://127.0.0.1:8088/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:8088/teacher/chat | grep -q 'id="root"'

      - name: Stop React Nginx verification container
        if: always()
        run: docker rm -f edumind-nginx-ci 2>/dev/null || true
