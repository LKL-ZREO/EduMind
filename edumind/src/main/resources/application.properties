
spring.application.name=edumind
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev,local}

# ==================== PostgreSQL ====================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/postgres
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=123456

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ==================== MyBatis-Plus ====================
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.type-aliases-package=com.firedemo.demo.Entity

# ==================== Authentication ====================

# 仅用于学生课堂范围令牌；教师 Web 登录使用 Redis Session。
edumind.live.token-secret=${LIVE_SESSION_TOKEN_SECRET:local-dev-live-token-secret-do-not-use-in-production}
edumind.live.student-token-ttl=PT2H

spring.session.timeout=8h
spring.session.redis.namespace=edumind:sessions
spring.session.redis.repository-type=indexed
server.servlet.session.cookie.name=EDUMIND_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.encrypt.aes-key=${ENCRYPT_AES_KEY:REVMT1lfREVWRUxPUE1FTlRfS0VZX0RPTl9OT1RfVVNFX0lOX1BST0RVQ1RJT04=}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

edumind.llm.backend=built-in
edumind.llm.base-url=${LLM_BASE_URL:https://api.deepseek.com}
edumind.llm.api-key=${LLM_API_KEY:change-me}
edumind.llm.model=${LLM_MODEL:deepseek-v4-pro}
edumind.llm.text-model=${LLM_TEXT_MODEL:deepseek-v4-pro}
edumind.llm.vision-base-url=${LLM_VISION_BASE_URL:https://api.moonshot.cn/v1}
edumind.llm.vision-api-key=${LLM_VISION_API_KEY:${LLM_API_KEY:change-me}}
edumind.llm.vision-model=${LLM_VISION_MODEL:kimi-k2.5}
edumind.llm.temperature=0.2
edumind.llm.vision-temperature=${LLM_VISION_TEMPERATURE:1.0}
edumind.llm.max-steps=10
edumind.llm.self-reflection=true

edumind.vision.max-image-bytes=${VISION_MAX_IMAGE_BYTES:20971520}
edumind.vision.connect-timeout=10s
edumind.vision.read-timeout=20s
edumind.vision.max-redirects=3
edumind.vision.allowed-hosts=${VISION_ALLOWED_HOSTS:multimedia.nt.qq.com.cn}
edumind.vision.trusted-private-resolution-hosts=${VISION_TRUSTED_PRIVATE_RESOLUTION_HOSTS:multimedia.nt.qq.com.cn}

# MCP API Key
mcp.api-key=${MCP_API_KEY:test-key}

spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=300000

# ==================== Redis ====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0


storage.type=${STORAGE_TYPE:local}
storage.upload-dir=${user.home}/.homework-grader/uploads


storage.s3.endpoint=${S3_ENDPOINT:}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.bucket=${S3_BUCKET:}
storage.s3.access-key=${S3_ACCESS_KEY:}
storage.s3.secret-key=${S3_SECRET_KEY:}
storage.s3.path-style-enabled=${S3_PATH_STYLE:true}


app.ai.reranker.model-dir=${AI_MODEL_DIR:}


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
knife4j.enable=true


rate-limit.anonymous-default.capacity=30
rate-limit.anonymous-default.refill-per-minute=20
rate-limit.authenticated-default.capacity=60
rate-limit.authenticated-default.refill-per-minute=40
# 认证接口限流 — 防暴力破解（令牌桶网关层）
rate-limit.rules[/api/auth/].capacity=10
rate-limit.rules[/api/auth/].refill-per-minute=5
rate-limit.rules[/api/homework/submit].capacity=5
rate-limit.rules[/api/homework/submit].refill-per-minute=3
rate-limit.rules[/api/dashboard/].capacity=60
rate-limit.rules[/api/dashboard/].refill-per-minute=30
rate-limit.rules[/api/rag/].capacity=30
rate-limit.rules[/api/rag/].refill-per-minute=15
rate-limit.rules[/api/chat/].capacity=40
rate-limit.rules[/api/chat/].refill-per-minute=20

# ==================== OneBot (QQ Bot) ====================
onebot.http.url=http://127.0.0.1:3000
onebot.http.token=${ONEBOT_TOKEN:}

# WebSocket
onebot.ws.enabled=true
onebot.ws.url=ws://127.0.0.1:3001
onebot.ws.path=/onebot/v11/ws
onebot.ws.access-token=${ONEBOT_WS_TOKEN:KlR82ViIJ.hbgENa}
onebot.ws.require-mention=true


server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s


# ==================== Actuator + Observability ====================
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=true


# 分发指标到 common-tags（所有指标自动携带此标签）
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=${SPRING_PROFILES_ACTIVE:dev}

# 按指标名分发（可按需调整）
management.metrics.enable.jvm=true
management.metrics.enable.logback=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.executor=true
management.metrics.enable.tomcat=true

# 连接池指标
management.metrics.enable.jdbc=true

# HikariCP 指标
management.metrics.enable.hikaricp=true


resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.llm.base-config=default

resilience4j.circuitbreaker.instances.llm.event-consumer-buffer-size=100
